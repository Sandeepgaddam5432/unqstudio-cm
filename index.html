    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is UnQStudio?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "UnQStudio is a free, browser-native AI coding studio. You describe an app in plain language, an AI model you choose writes the code, and it compiles live in a sandboxed preview — all inside your browser tab."
      }
    },
    {
      "@type": "Question",
      "name": "Does UnQStudio have a backend?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. It is a static site hosted on Cloudflare Pages. Projects live in your browser (IndexedDB), builds run with esbuild-wasm, and AI requests go directly from your browser to the provider you pick. Optional edge functions only power the models.dev registry and GitHub sign-in."
      }
    },
    {
      "@type": "Question",
      "name": "Is it really free, and what does BYOK mean?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "UnQStudio is free. BYOK means bring your own key: you paste an API key from OpenAI, Anthropic, Google, OpenRouter, Groq, Ollama or any other supported provider, and you pay that provider directly (many have free tiers)."
      }
    },
    {
      "@type": "Question",
      "name": "Are my API keys and code private?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Keys are stored only on your device in IndexedDB and can be encrypted with a passphrase (PBKDF2 and AES-GCM-256 via Web Crypto). Your code never touches a UnQStudio server."
      }
    },
    {
      "@type": "Question",
      "name": "Which AI models and providers are supported?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Every provider in the open models.dev registry (300+ providers, thousands of models). When you enter a key, UnQStudio fetches that provider's live model list automatically. Browser-ready, local (Ollama, LM Studio) and gateway-only providers are clearly tagged."
      }
    },
    {
      "@type": "Question",
      "name": "What is the difference between Studio mode and Code mode?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Studio mode is chat-first: talk to the AI beside a live preview. Code mode is a full editor on the same project with a file tree, file locks, CodeMirror 6, search, diff viewer and console. Switch any time with Ctrl/Cmd+E."
      }
    }
  ]
}
